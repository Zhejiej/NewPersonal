    <script>
      (function() {
        var s = localStorage.getItem('portfolio-theme');
        var d = window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme', (s === 'dark' || (!s && d)) ? 'dark' : 'light');
      })();
    </script>
    <meta name="description" content="Journal entry — Zhejie (Jacky) Jiang">

    <meta property="og:description" content="A journal entry by Zhejie (Jacky) Jiang.">
    <meta property="og:image" content="https://zhejiej.github.io/NewPersonal/images/about-photo.png">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="icon" href="favicon.png" type="image/png">
    <link rel="apple-touch-icon" href="favicon.png">

    <link rel="stylesheet" href="css/style.css">
