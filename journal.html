<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
      (function() {
        var s = localStorage.getItem('portfolio-theme');
        var d = window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme', (s === 'dark' || (!s && d)) ? 'dark' : 'light');
      })();
    </script>
    <meta name="description" content="Journal by Zhejie (Jacky) Jiang — monthly posts coming soon.">
    <title>Journal | Zhejie Jiang</title>
    <link rel="canonical" href="https://zhejiej.github.io/NewPersonal/journal.html">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Journal | Zhejie Jiang">
    <meta property="og:description" content="Journal by Zhejie (Jacky) Jiang — thoughts, updates, and a song of the moment.">
    <meta property="og:url" content="https://zhejiej.github.io/NewPersonal/journal.html">
    <meta property="og:image" content="https://zhejiej.github.io/NewPersonal/images/about-photo.png">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="icon" href="favicon.png" type="image/png">
    <link rel="apple-touch-icon" href="favicon.png">

    <link rel="stylesheet" href="css/style.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
    <a href="#main-content" class="skip-link">Skip to main content</a>
    <div data-shared="nav"></div>

    <div class="journal-layout" id="main-content">
        <section class="journal-section">
            <h2>Monthly Journal (hopefully)</h2>
            <div id="journal-controls" class="journal-controls" hidden>
                <input type="search" id="journal-search" class="journal-search" placeholder="Search entries…" aria-label="Search journal entries">
                <div id="journal-filters" class="journal-filters" role="group" aria-label="Filter by tag"></div>
            </div>
            <p id="journal-placeholder" class="journal-placeholder">Journal entries coming soon.</p>
            <div id="journal-list" class="journal-list" aria-live="polite"></div>
        </section>
        <div class="journal-side">
            <aside class="music-sidebar" aria-label="Favorite music">
                <h2 class="music-sidebar-title">Song of the moment</h2>
                <div id="music-current" class="music-current"></div>
                <p id="music-placeholder" class="music-placeholder">Loading…</p>
                <h3 class="music-playlist-title">Previous favorites</h3>
                <div id="music-playlist" class="music-playlist"></div>
            </aside>
            <a class="playlist-btn"
                href="https://www.youtube.com/playlist?list=PLnaxsl0RcX5jnKbHUz7bkICkJlxkniH5T"
                target="_blank" rel="noopener noreferrer">Chinese playlist</a>
        </div>
    </div>

    <div id="music-modal" class="music-modal" aria-hidden="true" role="dialog" aria-label="Play song">
        <div class="music-modal-backdrop"></div>
        <div class="music-modal-content">
            <button type="button" class="music-modal-close" aria-label="Close">&times;</button>
            <div id="music-modal-player" class="music-modal-player"></div>
        </div>
    </div>

    <!-- Footer (rendered by js/layout.js) -->
    <div data-shared="footer"></div>
    <script src="js/layout.js"></script>
    <script src="js/config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="js/journal.js"></script>
    <script src="js/music.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
