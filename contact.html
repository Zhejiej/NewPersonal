<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
      (function() {
        var s = localStorage.getItem('portfolio-theme');
        var d = window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme', (s === 'dark' || (!s && d)) ? 'dark' : 'light');
      })();
    </script>
    <meta name="description" content="Get in touch with Zhejie Jiang. Email and contact form for inquiries.">
    <title>Contact | Zhejie Jiang</title>
    <link rel="canonical" href="https://zhejiej.github.io/NewPersonal/contact.html">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Contact | Zhejie Jiang">
    <meta property="og:description" content="Get in touch with Zhejie Jiang. Email and contact form for inquiries.">
    <meta property="og:url" content="https://zhejiej.github.io/NewPersonal/contact.html">
    <meta property="og:image" content="https://zhejiej.github.io/NewPersonal/images/about-photo.png">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="icon" href="favicon.png" type="image/png">
    <link rel="apple-touch-icon" href="favicon.png">

    <link rel="stylesheet" href="css/style.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
    <a href="#main-content" class="skip-link">Skip to main content</a>
    <div data-shared="nav"></div>

    <section class="contact" id="main-content">
        <h1>Contact Me</h1>
        <p class="contact-email">
            <a href="mailto:zhejiejiang@gmail.com">zhejiejiang@gmail.com</a>
        </p>
        <p class="contact-subtext">Feel free to reach out with any inquiries!</p>

        <form class="contact-form" id="contact-form" action="https://api.web3forms.com/submit" method="POST">
            <input type="hidden" name="access_key" value="d6f2caf9-a81f-435c-a188-7a348fc612eb">

            <div class="form-row">
                <input type="text" name="name" placeholder="Name" required>
                <input type="email" name="email" placeholder="Email Address" required>
            </div>
            <div class="form-row">
                <textarea name="message" placeholder="Message" rows="5" required></textarea>
            </div>
            <button type="submit" class="btn submit-btn" id="submit-btn">Submit</button>
        </form>
        <p class="form-success" id="form-success" aria-live="polite" hidden>Thanks, I'll get back to you soon.</p>
    </section>
    <!-- Footer (rendered by js/layout.js) -->
    <div data-shared="footer"></div>
    <script src="js/layout.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
